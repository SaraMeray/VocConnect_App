<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Oak VocConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/x-icon" href="https://sarameray.github.io/VocConnect_App/favicon.ico">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand" onclick="go('home')" style="cursor:pointer">
      <span class="dot"></span>
      <span style="color:#fff">VOC</span>
      <span style="color:var(--medgreen)">CONNECT</span>
      <small>Red Oak</small>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="navManage">Manage</button>
    <button class="iconbtn" id="navReports">Reports</button>
    <button class="iconbtn" id="navRecent">Recent</button>
    <div class="user">
      <span class="avatar" id="uAv">DR</span>
      <span id="uName">Demo Teacher</span>
    </div>
  </div>
  
  <div class="wrap" id="app"></div>
  <div id="savebar"></div>

  <!-- JavaScript modules -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/manage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
